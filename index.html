<!DOCTYPE html>
<html>
<head>
    <link rel="manifest" href="/manifest.json">
    <title>我的普通小网站</title>
    <!-- 黑底白色E. 网页图标 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text x='50' y='.9em' font-size='90' text-anchor='middle' fill='white'>E</text></svg>">
    <style>
        body {
            background-color: #f5f5f5; 
            font-family: 微软雅黑, sans-serif; 
            margin: 0;
            padding: 50px;
            text-align: center;
        }
        .box {
            background: white; 
            padding: 30px;
            border-radius: 10px; 
            box-shadow: 0 0 10px #ddd; 
            max-width: 600px;
            margin: 0 auto 20px;
        }
        h1 {
            color: #333;
            font-size: 28px;
        }
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }
        textarea {
            width: 500px; 
            height: 300px; 
            font-size: 18px;
        }
        #pwd{
            padding:12px;
            width:260px;
            font-size:18px;
            margin-right:10px;
        }
        button{
            padding:10px 18px;
            font-size:16px;
            cursor:pointer;
            margin:3px;
            border:none;
            border-radius:6px;
        }
        .file-row{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
        }
        .x-del{
            width:26px;
            height:26px;
            background:#ed3333;
            color:#fff;
            border-radius:50%;
            font-size:15px;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
        }
        select{
            padding:8px;
            font-size:16px;
            width:220px;
        }
        #secretPage{
            display:none;
        }
        /* 下载按钮样式 */
        .download-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #1677ff;
            color: #fff;
            text-decoration: none;
            font-size: 17px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background-color: #0958d9;
        }
    </style>
</head>
<body>
<div id="mainPage">
    <div class="box">
        <h1>欢迎来到我的网站！</h1>
        <p>这是我做的第一个网站。</p>
        <p>你可以在这里写任何你想写的话，比如你的爱好、你的日常。</p>
    </div>

    <!-- 游戏下载区域（ZIP压缩包） -->
    <div class="box">
        <h1>🎮 红蓝方块小游戏</h1>
        <p>WASD控制蓝色方块 | 方向键控制红色方块 | ESC退出游戏</p>
        <a href="红蓝方块游戏.zip" download="红蓝方块游戏.zip" class="download-btn">
            点击下载游戏
        </a>
        <p style="margin-top: 15px; font-size: 14px; color: #999;">
            下载后解压压缩包即可运行游戏，Windows安全提示选择仍要运行
        </p>
    </div>

    <div class="box">
        <textarea placeholder="你在这里可以打字"></textarea>
    </div>
    <div class="box">
        <p>输入密码进入秘密网页</p>
        <input type="password" id="pwd" placeholder="请输入密码">
        <button onclick="showPwd()">显示/隐藏</button>
        <button onclick="checkPwd()">进入秘密页</button>
    </div>

    <!-- 新增：跳转附站区域 -->
    <div class="box">
        <h1>🌐 跳转我的附属站点</h1>
        <p>点击下方按钮前往第二个独立网站</p>
        <a href="https://eason-su725.github.io/Su/" target="_blank" class="download-btn">
            进入附属站点
        </a>
    </div>
</div>
<div id="secretPage">
    <div class="box">
        <h1>🔐 秘密文件空间</h1>
        <p>可以创建多个文件，保存内容，随时打开查看</p>
        <br>
        <div class="file-row">
            <select id="fileSelect" onchange="openFile()">
                <option value="" disabled selected>请选择文件</option>
            </select>
            <div class="x-del" onclick="delIt()">×</div>
        </div>
        <br><br>
        <button onclick="newFile()">新建空白文件</button>
    </div>
    <div class="box">
        <textarea id="content" placeholder="在这里写文件内容"></textarea>
    </div>
    <div class="box">
        <button onclick="saveFile()">保存文件</button>
        <button onclick="backMain()">退出返回第一个网站</button>
    </div>
</div>
<script>
let currentFileIndex = -1;
function showPwd(){
    let i=document.getElementById("pwd");
    i.type=i.type=="password"?"text":"password";
}
function checkPwd(){
    let p=document.getElementById("pwd").value;
    if(p=="20160725"){
        document.getElementById("mainPage").style.display="none";
        document.getElementById("secretPage").style.display="block";
        loadFileList();
        newFile();
    }else{
        alert("密码错误");
    }
}
function backMain(){
    document.getElementById("secretPage").style.display="none";
    document.getElementById("mainPage").style.display="block";
    document.getElementById("pwd").value="";
}
function loadFileList(){
    let sel = document.getElementById("fileSelect");
    sel.innerHTML = '<option value="" disabled selected>请选择文件</option>';
    let files = JSON.parse(localStorage.getItem("myFiles") || "[]");
    for(let i=0;i<files.length;i++){
        let opt = document.createElement("option");
        opt.value = i;
        opt.innerText = "文件 " + (i+1);
        sel.appendChild(opt);
    }
}
function newFile(){
    document.getElementById("content").value = "";
    currentFileIndex = -1;
    document.getElementById("fileSelect").value = "";
}
function openFile(){
    let index = document.getElementById("fileSelect").value;
    if(index === "") return;
    currentFileIndex = parseInt(index);
    let files = JSON.parse(localStorage.getItem("myFiles") || "[]");
    document.getElementById("content").value = files[currentFileIndex];
}
function saveFile(){
    let text = document.getElementById("content").value;
    let files = JSON.parse(localStorage.getItem("myFiles") || "[]");
    if(currentFileIndex >= 0){
        files[currentFileIndex] = text;
    }else{
        files.push(text);
    }
    localStorage.setItem("myFiles", JSON.stringify(files));
    loadFileList();
}
function delIt(){
    let s=document.getElementById("fileSelect");
    let num=s.value;
    if(num==""){alert("先选文件");return;}
    let d=JSON.parse(localStorage.myFiles||"[]");
    d.splice(num,1);
    localStorage.myFiles=JSON.stringify(d);
    newFile();
    loadFileList();
}
</script>
</body>
</html>
